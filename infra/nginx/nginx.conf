# Solenne gateway: serves the SPA, proxies /api and /admin to the Django replicas, rate-limits, logs JSON.
worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 2048;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65s;

  # ---- logging ------------------------------------------------------------------------------------------------
  # One JSON object per line; request_id is also sent upstream and appears in Django logs and Kafka events.
  # The method from the original request line: $request_method turns into GET when error_page redirects
  # (e.g. a rate-limited POST served /errors/429.json).
  map $request $request_verb {
    "~^(?<verb>[A-Z]+) " $verb;
    default "-";
  }

  log_format json escape=json '{'
    '"time":"$time_iso8601",'
    '"request_id":"$request_id",'
    '"remote_addr":"$remote_addr",'
    '"method":"$request_verb",'
    '"uri":"$request_uri",'
    '"status":$status,'
    '"bytes":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_addr":"$upstream_addr",'
    '"upstream_status":"$upstream_status",'
    '"upstream_response_time":"$upstream_response_time",'
    '"limit_req":"$limit_req_status",'
    '"user_agent":"$http_user_agent"'
  '}';
  access_log /dev/stdout json;
  access_log /var/log/nginx/access.json.log json;
  error_log /dev/stderr warn;

  # ---- request limits -----------------------------------------------------------------------------------------
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  # Only placing an order counts against the orders zone; the owner's GET of the ledger does not (empty key = not limited).
  map $request_method $order_post_key {
    POST    $binary_remote_addr;
    default "";
  }
  limit_req_zone $order_post_key zone=orders:10m rate=5r/m;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
  limit_conn_zone $binary_remote_addr zone=perip:10m;
  limit_req_status 429;
  limit_conn_status 429;
  limit_req_log_level warn;

  client_body_timeout 10s;
  client_header_timeout 10s;
  send_timeout 15s;
  client_max_body_size 1m;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_vary on;
  gzip_types application/json application/javascript text/css image/svg+xml text/plain;

  # ---- upstream: every `api` replica, re-resolved through Docker DNS ------------------------------------------
  resolver 127.0.0.11 valid=10s ipv6=off;
  upstream api {
    zone api_upstream 64k;  # distinct from the limit_req zone named "api"
    least_conn;
    server api:8000 resolve max_fails=3 fail_timeout=10s;
    keepalive 32;
  }

  include /etc/nginx/conf.d/solenne.conf;
}
