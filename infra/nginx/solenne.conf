# Cache policy by path. Empty = add nothing (Django sets its own, e.g. spot is public max-age=30).
map $uri $cache_control {
  ~^/api/      "";
  ~^/admin/    "";
  ~^/assets/   "public, max-age=31536000, immutable";   # Vite hashes every file name
  ~^/static/   "public, max-age=604800";
  default      "no-cache";                               # index.html: always revalidate
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  limit_conn perip 20;

  # Declared once here; no location below uses add_header, so every response inherits all of them.
  add_header X-Request-ID $request_id always;
  add_header Cache-Control $cache_control always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' blob: data:; connect-src 'self'; frame-ancestors 'none'" always;

  # nginx's own refusals (rate limit, no healthy replica) answer in the API's JSON envelope.
  # Django's errors pass through untouched (proxy_intercept_errors is off), e.g. DRF's 429 with its exact retryAfter.
  error_page 429 /errors/429.json;
  error_page 502 503 504 /errors/503.json;
  location ^~ /errors/ {
    internal;
    root /etc/nginx;
    default_type application/json;
  }

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Request-ID $request_id;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_connect_timeout 5s;
  proxy_send_timeout 30s;
  proxy_read_timeout 30s;
  proxy_buffers 16 16k;
  proxy_hide_header X-Request-ID;  # Django echoes nginx's id; send it once, from the add_header above
  # Fail over to another replica on connection errors. nginx never replays POST/PATCH/PUT
  # (non_idempotent is not set), so an order is never submitted twice by the gateway.
  proxy_next_upstream error timeout http_502 http_503;
  proxy_next_upstream_tries 2;

  # ---- API ------------------------------------------------------------------------------------------------------
  location /api/ {
    client_max_body_size 64k;
    limit_req zone=api burst=40 nodelay;
    proxy_pass http://api;
  }

  location = /api/v1/orders/ {
    client_max_body_size 64k;
    limit_req zone=api burst=40 nodelay;
    limit_req zone=orders burst=3 nodelay;
    proxy_pass http://api;
  }

  location ^~ /api/v1/auth/ {
    client_max_body_size 4k;
    limit_req zone=auth burst=5 nodelay;
    proxy_pass http://api;
  }

  location = /api/v1/health/ {
    access_log off;
    proxy_pass http://api;
  }

  # ---- Django admin + its static files ----------------------------------------------------------------------------
  location /admin/ {
    limit_req zone=auth burst=20 nodelay;
    proxy_pass http://api;
  }

  location /static/ {
    alias /var/www/static/;
    access_log off;
  }

  # ---- SPA --------------------------------------------------------------------------------------------------------
  location /assets/ {
    access_log off;
    try_files $uri =404;
  }

  location / {
    limit_req zone=api burst=40 nodelay;
    try_files $uri /index.html;
  }
}
